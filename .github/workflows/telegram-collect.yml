name: Telegram link collector

on:
  schedule:
    # Every 2 hours. Telegram only retains unconfirmed getUpdates results for 24h, so keep this well under a day.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      export_path:
        description: "Repo-relative path of a Telegram Desktop export (result.json) to backfill from"
        required: false
        type: string
  repository_dispatch:
    # POST /repos/{owner}/{repo}/dispatches with {"event_type": "collect-url", "client_payload": {"url": "...", "source": "..."}}
    types: [collect-url]

permissions:
  contents: write

concurrency:
  group: telegram-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the rebase below can find a merge base; a shallow clone makes every file an add/add conflict.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Collect links and fetch content
        run: python scripts/telegram_collect.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ vars.TELEGRAM_ALLOWED_CHAT_IDS }}
          # Empty on schedule/workflow_dispatch, so the script falls back to polling Telegram.
          INBOX_URLS: ${{ github.event.client_payload.url }}
          INBOX_SOURCE: ${{ github.event.client_payload.source }}
          INBOX_EXPORT: ${{ inputs.export_path }}

      - name: Commit inbox changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_inbox
          if git diff --cached --quiet; then
            echo "No new links."
            exit 0
          fi
          git commit -m "Telegram inbox: collect links $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
