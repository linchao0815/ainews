name: Telegram link collector

on:
  schedule:
    # Every 2 hours. Telegram only retains unconfirmed getUpdates results for 24h, so keep this well under a day.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Collect links and fetch content
        run: python scripts/telegram_collect.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ vars.TELEGRAM_ALLOWED_CHAT_IDS }}

      - name: Commit inbox changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_inbox
          if git diff --cached --quiet; then
            echo "No new links."
            exit 0
          fi
          git commit -m "Telegram inbox: collect links $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
